<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freedom Finance - Tu Camino a la Libertad</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a1a;
            --secondary: #2d2d2d;
            --accent: #00d9ff;
            --accent-hover: #00b8d4;
            --dark: #0a0a0a;
            --light: #ffffff;
            --text-secondary: #a0a0a0;
            --glass: rgba(30, 30, 30, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 50%, #0f0f0f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        .digital-card {
            width: 100%;
            max-width: 450px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
            animation: cardFloat 6s ease-in-out infinite;
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .digital-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            opacity: 0.3;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: var(--light);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo i {
            color: var(--accent);
        }

        .tagline {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            max-width: 90%;
            margin: 0 auto;
        }

        .stats-compact {
            display: flex;
            justify-content: space-around;
            margin: 20px 0 25px 0;
            padding: 10px 8px;
            background: rgba(0, 217, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 217, 255, 0.1);
            border-radius: 12px;
            position: relative;
            z-index: 1;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
        }

        .stat-label {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .courses-slider-container {
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .courses-slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .courses-slider-header h3 {
            color: var(--light);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .courses-slider-header h3 i {
            color: var(--accent);
        }

        .slider-controls {
            display: flex;
            gap: 10px;
        }

        .slider-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--secondary);
            border: 1px solid var(--glass-border);
            color: var(--accent);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .slider-btn:hover {
            background: var(--accent);
            color: var(--dark);
            transform: scale(1.1);
        }

        .courses-slider {
            overflow: hidden;
            border-radius: 15px;
        }

        .courses-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        .course-slide {
            min-width: 100%;
            padding: 15px;
        }

        .course-card {
            background: var(--secondary);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .course-card:hover {
            transform: scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.2);
        }

        .course-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }

        .course-icon {
            font-size: 2.2rem;
            color: var(--accent);
        }

        .course-info h4 {
            color: var(--light);
            font-size: 1.05rem;
            margin-bottom: 5px;
        }

        .course-price {
            color: var(--accent);
            font-size: 1rem;
            font-weight: bold;
        }

        .course-description {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .course-features {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 15px;
        }

        .feature-tag {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.2);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        .course-action {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border: none;
            border-radius: 12px;
            color: var(--dark);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .course-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.4);
        }

        .digital-products-btn {
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
        }

        /* Star Border Button Styles */
        .star-border-container {
            display: inline-block;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
        }

        .border-gradient-bottom {
            position: absolute;
            width: 300%;
            height: 50%;
            opacity: 0.7;
            bottom: -12px;
            right: -250%;
            border-radius: 50%;
            animation: star-movement-bottom linear infinite alternate;
            z-index: 0;
        }

        .border-gradient-top {
            position: absolute;
            opacity: 0.7;
            width: 300%;
            height: 50%;
            top: -12px;
            left: -250%;
            border-radius: 50%;
            animation: star-movement-top linear infinite alternate;
            z-index: 0;
        }

        .inner-content {
            position: relative;
            border: 1px solid #333;
            background: var(--secondary);
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            padding: 15px 26px;
            border-radius: 20px;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .inner-content:hover {
            background: rgba(45, 45, 45, 0.8);
        }

        @keyframes star-movement-bottom {
            0% {
                transform: translate(0%, 0%);
                opacity: 1;
            }
            100% {
                transform: translate(-100%, 0%);
                opacity: 0;
            }
        }

        @keyframes star-movement-top {
            0% {
                transform: translate(0%, 0%);
                opacity: 1;
            }
            100% {
                transform: translate(100%, 0%);
                opacity: 0;
            }
        }

        .social-section {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .social-section h3 {
            color: var(--light);
            font-size: 1.1rem;
            margin-bottom: 15px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-section h3 i {
            color: var(--accent);
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .social-btn {
            background: var(--secondary);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 8px;
            text-decoration: none;
            color: var(--light);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }

        .social-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        .social-btn:hover::after {
            width: 150px;
            height: 150px;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.2);
        }

        .social-icon {
            font-size: 1.4rem;
            z-index: 1;
            position: relative;
        }

        .social-label {
            font-size: 0.7rem;
            z-index: 1;
            position: relative;
            color: var(--text-secondary);
        }

        .instagram { color: #E4405F; }
        .whatsapp { color: #25D366; }
        .facebook { color: #1877F2; }
        .tiktok { color: var(--light); }

        .cta-section {
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .cta-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            border: none;
            border-radius: 15px;
            color: var(--dark);
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .cta-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 217, 255, 0.4);
        }

        /* Star Border Button Styles */
        .star-border-container {
            display: inline-block;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            width: 100%;
            margin-bottom: 20px;
        }

        .border-gradient-bottom {
            position: absolute;
            width: 300%;
            height: 50%;
            opacity: 0.7;
            bottom: -12px;
            right: -250%;
            border-radius: 50%;
            animation: star-movement-bottom linear infinite alternate;
            z-index: 0;
        }

        .border-gradient-top {
            position: absolute;
            opacity: 0.7;
            width: 300%;
            height: 50%;
            top: -12px;
            left: -250%;
            border-radius: 50%;
            animation: star-movement-top linear infinite alternate;
            z-index: 0;
        }

        .inner-content {
            position: relative;
            border: 1px solid #333;
            background: var(--secondary);
            color: white;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            padding: 15px 26px;
            border-radius: 20px;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .inner-content:hover {
            background: rgba(45, 45, 45, 0.8);
        }

        @keyframes star-movement-bottom {
            0% {
                transform: translate(0%, 0%);
                opacity: 1;
            }
            100% {
                transform: translate(-100%, 0%);
                opacity: 0;
            }
        }

        @keyframes star-movement-top {
            0% {
                transform: translate(0%, 0%);
                opacity: 1;
            }
            100% {
                transform: translate(100%, 0%);
                opacity: 0;
            }
        }

        .digital-products-btn {
            position: relative;
            z-index: 1;
        }

        .slider-indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
        }

        .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background: var(--accent);
            width: 24px;
            border-radius: 4px;
        }

        @media (max-width: 480px) {
            .digital-card {
                padding: 20px;
            }
            
            .social-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .social-btn {
                padding: 14px 10px;
            }
            
            .social-icon {
                font-size: 1.6rem;
            }
            
            .social-label {
                font-size: 0.75rem;
            }
        }

        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            transition: opacity 0.5s ease;
        }

        .loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader-circle {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 217, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <script>
        const coursesDatabase = [
            {
                id: 1,
                title: "Camino al Primer Millón",
                price: "$47",
                icon: "fas fa-road",
                description: "Descubre 10 negocios rentables para tu éxito financiero y transforma tus finanzas",
                features: ["Ebook exclusivo", "Plan de acción", "Plantilla financiera"],
                hotmartUrl: "https://go.hotmart.com/G102721289A"
            },
            {

                title: "Estrategias de Inversión",
                price: "$97",
                icon: "fas fa-chart-line",
                description: "Aprende técnicas avanzadas para multiplicar tu capital con inversiones inteligentes",
                features: ["Análisis técnico", "Gestión de riesgo", "Casos reales"],
                hotmartUrl: "https://go.hotmart.com/A102721287E"
            },
            {
                id: 3,
                title: "Educación Financiera para Niños",
                price: "$37",
                icon: "fas fa-child",
                description: "Curso de 7 días para enseñar finanzas a los más pequeños de la casa",
                features: ["7 módulos diarios", "Actividades interactivas", "Guía para padres"],
                hotmartUrl: "https://go.hotmart.com/L102721297M"
            },
            {
                id: 4,
                title: "Independencia Financiera Mentoring",
                price: "$297",
                icon: "fas fa-trophy",
                description: "Programa completo con mentoría personalizada para alcanzar tu libertad financiera",
                features: ["Acompañamiento continuo", "Estrategias probadas", "Comunidad exclusiva"],
                hotmartUrl: "https://go.hotmart.com/F102721278V"
            },
            {
                id: 5,
                title: "Finanzas Personales Avanzadas",
                price: "$67",
                icon: "fas fa-wallet",
                description: "Domina el control de tus finanzas personales y multiplica tu patrimonio",
                features: ["Presupuesto maestro", "Ahorro inteligente", "Inversión básica"],
                hotmartUrl: "https://go.hotmart.com/P102802168A"
            },
            {
                id: 6,
                title: "Trading y Mercados Financieros",
                price: "$147",
                icon: "fas fa-chart-bar",
                description: "Aprende a operar en los mercados como un profesional con estrategias ganadoras",
                features: ["Trading en vivo", "Indicadores técnicos", "Psicología del trader"],
                hotmartUrl: "https://go.hotmart.com/X102802160F"
            },
            {
                id: 7,
                title: "Finanzas para Niños - Completo",
                price: "$57",
                icon: "fas fa-graduation-cap",
                description: "Programa interactivo completo para enseñar el valor del dinero a tus hijos",
                features: ["4 módulos completos", "2 bonos incluidos", "Juegos prácticos"],
                hotmartUrl: "https://go.hotmart.com/F102721304V"
            }
        ];

        let currentSlide = 0;

        document.addEventListener('DOMContentLoaded', () => {
            initializeSlider();
            initializeParticles();
            animateCounters();
            
            setTimeout(() => {
                document.getElementById('loader').classList.add('hidden');
            }, 1000);
        });

        function initializeSlider() {
            const track = document.getElementById('coursesTrack');
            const indicators = document.getElementById('sliderIndicators');
            
            coursesDatabase.forEach((course, index) => {
                const slide = document.createElement('div');
                slide.className = 'course-slide';
                slide.innerHTML = `
                    <div class="course-card">
                        <div class="course-header">
                            <i class="${course.icon} course-icon"></i>
                            <div class="course-info">
                                <h4>${course.title}</h4>
                                <div class="course-price">${course.price}</div>
                            </div>
                        </div>
                        <p class="course-description">${course.description}</p>
                        <div class="course-features">
                            ${course.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
                        </div>
                        <button class="course-action" onclick="buyCourse(${course.id})">
                            <i class="fas fa-shopping-cart"></i> Comprar en Hotmart
                        </button>
                    </div>
                `;
                track.appendChild(slide);
                
                const indicator = document.createElement('div');
                indicator.className = `indicator ${index === 0 ? 'active' : ''}`;
                indicator.onclick = () => goToSlide(index);
                indicators.appendChild(indicator);
            });
        }

        function updateSlider() {
            const track = document.getElementById('coursesTrack');
            const indicators = document.querySelectorAll('.indicator');
            
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            indicators.forEach((indicator, index) => {
                indicator.classList.toggle('active', index === currentSlide);
            });
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % coursesDatabase.length;
            updateSlider();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + coursesDatabase.length) % coursesDatabase.length;
            updateSlider();
        }

        function goToSlide(index) {
            currentSlide = index;
            updateSlider();
        }

        setInterval(nextSlide, 5000);

        function initializeParticles() {
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2 + 1;
                    this.speedX = Math.random() * 2 - 1;
                    this.speedY = Math.random() * 2 - 1;
                    this.opacity = Math.random() * 0.5 + 0.2;
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;

                    if (this.x > canvas.width) this.x = 0;
                    if (this.x < 0) this.x = canvas.width;
                    if (this.y > canvas.height) this.y = 0;
                    if (this.y < 0) this.y = canvas.height;
                }

                draw() {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.4})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                for (let i = 0; i < 50; i++) {
                    particles.push(new Particle());
                }
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                particles.forEach(particle => {
                    particle.update();
                    particle.draw();
                });

                requestAnimationFrame(animateParticles);
            }

            initParticles();
            animateParticles();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initParticles();
            });
        }

        function animateCounters() {
            const counters = document.querySelectorAll('.stat-number');
            const speed = 200;

            const countUp = () => {
                counters.forEach(counter => {
                    const target = +counter.getAttribute('data-target');
                    const count = +counter.innerText;
                    const increment = target / speed;

                    if (count < target) {
                        counter.innerText = Math.ceil(count + increment);
                        setTimeout(countUp, 10);
                    } else {
                        counter.innerText = target;
                    }
                });
            };

            setTimeout(countUp, 1500);
        }

        function buyCourse(courseId) {
            const course = coursesDatabase.find(c => c.id === courseId);
            if (course) {
                window.open(course.hotmartUrl, '_blank');
            }
        }

        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });

        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                nextSlide();
            }
            if (touchEndX > touchStartX + 50) {
                prevSlide();
            }
        }

        document.querySelectorAll('.course-card, .social-btn').forEach(element => {
            element.addEventListener('mouseenter', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                this.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(0, 217, 255, 0.15), var(--secondary))`;
            });
            
            element.addEventListener('mouseleave', function() {
                this.style.background = '';
            });
        });
    </script>
</body>
</html>
