<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gabora646 · Freedom Finance — Tu camino a la libertad</title>
  <meta name="description" content="Aprende las estrategias probadas para alcanzar la independencia económica. Cursos de finanzas, inversión y trading por Gabora646.">
  <meta name="theme-color" content="#03060c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta property="og:title" content="Gabora646 · Freedom Finance">
  <meta property="og:description" content="Estrategias probadas para alcanzar la independencia económica.">
  <meta property="og:image" content="assets/icon-512.png">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #03060c;
      --cyan: #00e5ff;
      --cyan-soft: #7df3ff;
      --blue: #3b6cff;
      --green: #1de9b6;
      --pink: #ff3d8b;
      --ink: #eafaff;
      --muted: #8fa9bb;
      --glass: rgba(7, 15, 27, .66);
      --glass-2: rgba(12, 24, 40, .72);
      --line: rgba(0, 229, 255, .16);
      --glow: 0 0 22px rgba(0, 229, 255, .35);
      --font-display: 'Outfit', 'Segoe UI', system-ui, sans-serif;
      --font-body: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    html, body { height: 100%; }
    html { color-scheme: dark; background: var(--bg); }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--bg);
      height: 100vh; height: 100dvh;
      overflow: hidden;
      display: grid; grid-template-columns: minmax(0, 1fr); place-items: center;
      width: 100%; max-width: 100vw;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* ---------- Fondo ---------- */
    .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg .blob { position: absolute; width: 60vmax; height: 60vmax; border-radius: 50%; filter: blur(70px); opacity: .5; will-change: transform; }
    .bg .b1 { background: radial-gradient(circle, rgba(0, 229, 255, .42), transparent 62%); top: -22vmax; left: -18vmax; animation: drift1 22s ease-in-out infinite alternate; }
    .bg .b2 { background: radial-gradient(circle, rgba(59, 108, 255, .42), transparent 62%); bottom: -26vmax; right: -20vmax; animation: drift2 26s ease-in-out infinite alternate; }
    .bg .b3 { background: radial-gradient(circle, rgba(29, 233, 182, .22), transparent 62%); top: 30%; left: 55%; width: 40vmax; height: 40vmax; animation: drift1 30s ease-in-out infinite alternate-reverse; }
    .bg .grid {
      position: absolute; inset: -2px;
      background-image: linear-gradient(rgba(0, 229, 255, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 229, 255, .06) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(ellipse at center, #000 20%, transparent 72%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 72%);
    }
    #particles { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .9; }
    @keyframes drift1 { to { transform: translate3d(9vmax, 7vmax, 0) scale(1.1); } }
    @keyframes drift2 { to { transform: translate3d(-8vmax, -9vmax, 0) scale(1.15); } }

    /* ---------- Tarjeta ---------- */
    .shell {
      position: relative; z-index: 1;
      width: min(100%, 460px); min-width: 0;
      height: 100%; max-height: 880px;
      display: flex; flex-direction: column;
      gap: clamp(6px, 1.3dvh, 14px);
      padding: clamp(12px, 2.2dvh, 22px) clamp(14px, 4vw, 22px);
      border-radius: 28px;
      background: linear-gradient(160deg, rgba(14, 28, 46, .74), var(--glass) 40%, rgba(5, 11, 20, .78));
      -webkit-backdrop-filter: blur(22px) saturate(1.3);
      backdrop-filter: blur(22px) saturate(1.3);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 60px rgba(0, 229, 255, .12), inset 0 1px 0 rgba(255, 255, 255, .08);
      isolation: isolate;
      animation: shellIn .9s var(--ease) both;
    }
    /* borde neón giratorio */
    .shell::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: -1;
      background: conic-gradient(from var(--a), transparent 0deg, var(--cyan) 50deg, var(--blue) 110deg, transparent 170deg, transparent 220deg, var(--green) 280deg, var(--cyan) 330deg, transparent 360deg);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: spin 7s linear infinite;
      filter: drop-shadow(0 0 6px rgba(0, 229, 255, .65));
    }
    /* foco que sigue al puntero */
    .shell::after {
      content: ''; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none;
      background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 0%), rgba(0, 229, 255, .10), transparent 60%);
    }
    @keyframes spin { to { --a: 360deg; } }
    @keyframes shellIn { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }

    .left, .right { display: contents; }

    /* animación de entrada escalonada */
    .rv { opacity: 0; transform: translateY(14px); animation: rise .8s var(--ease) forwards; animation-delay: calc(var(--i, 0) * 90ms + 250ms); }
    @keyframes rise { to { opacity: 1; transform: none; } }

    /* ---------- Marca ---------- */
    .brand { order: 1; display: flex; flex-direction: column; align-items: center; flex: none; text-align: center; }
    .logo-wrap { position: relative; display: grid; place-items: center; }
    .logo-wrap::before {
      content: ''; position: absolute; inset: -22%; border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 229, 255, .34), rgba(59, 108, 255, .16) 45%, transparent 70%);
      animation: breathe 4.5s ease-in-out infinite;
    }
    .logo {
      position: relative; display: block;
      height: clamp(50px, 11.5dvh, 124px); width: auto; max-width: 100%;
      filter: drop-shadow(0 0 14px rgba(0, 229, 255, .55)) drop-shadow(0 0 34px rgba(59, 108, 255, .35));
      animation: floaty 6s ease-in-out infinite;
    }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes breathe { 0%, 100% { opacity: .65; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }

    #tt {
      width: 100%; height: clamp(54px, 9.2dvh, 104px);
      color: #f2fdff; font-family: var(--font-display);
      filter: drop-shadow(0 0 10px rgba(0, 229, 255, .5)) drop-shadow(0 0 26px rgba(0, 229, 255, .25));
      margin-top: clamp(0px, .4dvh, 4px);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font: 600 .64rem/1 var(--font-body); letter-spacing: .22em; text-transform: uppercase; color: var(--cyan-soft);
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(0, 229, 255, .06);
    }
    .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: blink 1.8s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .tagline { margin-top: clamp(6px, 1.2dvh, 10px); font-size: clamp(.74rem, 1.9dvh, .86rem); line-height: 1.45; color: var(--muted); max-width: 34ch; }

    /* ---------- Botón Productos Digitales ---------- */
    .cta-products {
      order: 2; flex: none; position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: clamp(11px, 1.9dvh, 15px) 20px; border-radius: 16px; text-decoration: none; color: var(--ink);
      font: 600 clamp(.9rem, 2.1dvh, 1rem)/1 var(--font-display); letter-spacing: .02em;
      background: linear-gradient(180deg, rgba(20, 40, 62, .9), rgba(8, 18, 32, .9));
      isolation: isolate; overflow: hidden; transition: transform .3s var(--ease), box-shadow .3s;
    }
    .cta-products::before {
      content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; z-index: -1;
      background: conic-gradient(from var(--a), var(--cyan), transparent 25%, transparent 50%, var(--blue), transparent 75%, var(--cyan));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; animation: spin 4s linear infinite;
    }
    .cta-products::after { /* destello */
      content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; z-index: -1;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .16), transparent);
      transform: skewX(-20deg); animation: shine 4.2s ease-in-out infinite;
    }
    @keyframes shine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
    .cta-products svg { width: 1.25em; height: 1.25em; color: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
    .cta-products .arr { width: 1.05em; height: 1.05em; opacity: .75; transition: transform .3s var(--ease); }
    .cta-products:hover, .cta-products:focus-visible { transform: translateY(-2px); box-shadow: 0 10px 34px rgba(0, 229, 255, .28); outline: none; }
    .cta-products:hover .arr { transform: translate(2px, -2px); }

    /* ---------- Estadísticas ---------- */
    .stats { order: 3; flex: none; display: grid; grid-template-columns: repeat(3, 1fr); border-radius: 16px; border: 1px solid var(--line); background: rgba(0, 229, 255, .04); }
    .stat { text-align: center; padding: clamp(7px, 1.3dvh, 11px) 4px; position: relative; }
    .stat + .stat::before { content: ''; position: absolute; left: 0; top: 22%; bottom: 22%; width: 1px; background: var(--line); }
    .stat b { display: block; font: 700 clamp(1.05rem, 2.6dvh, 1.35rem)/1.1 var(--font-display); color: var(--cyan); text-shadow: 0 0 16px rgba(0, 229, 255, .6); font-variant-numeric: tabular-nums; }
    .stat span { display: block; margin-top: 3px; font-size: .66rem; letter-spacing: .04em; color: var(--muted); }

    /* ---------- Cursos ---------- */
    .courses { order: 4; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: clamp(5px, 1dvh, 10px); }
    .courses-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .courses-head h2 { display: flex; align-items: center; gap: 8px; font: 600 clamp(.92rem, 2.1dvh, 1.02rem)/1 var(--font-display); letter-spacing: .01em; }
    .courses-head h2 svg { width: 1.15em; height: 1.15em; color: var(--cyan); filter: drop-shadow(0 0 6px var(--cyan)); }
    .counter { font: 500 .72rem/1 var(--font-body); color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .06em; }
    .counter b { color: var(--cyan); font-weight: 600; }
    .ctrls { display: flex; gap: 8px; align-items: center; }
    .arrow {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--cyan);
      background: rgba(0, 229, 255, .06); border: 1px solid var(--line); transition: all .25s var(--ease);
    }
    .arrow svg { width: 16px; height: 16px; }
    .arrow:hover, .arrow:focus-visible { background: var(--cyan); color: #00131a; box-shadow: 0 0 20px rgba(0, 229, 255, .6); outline: none; transform: scale(1.08); }
    .arrow:active { transform: scale(.94); }

    .viewport { flex: 1 1 0; min-height: 0; overflow: hidden; border-radius: 20px; touch-action: pan-y; position: relative; }
    .track { display: flex; height: 100%; transition: transform .7s var(--ease); will-change: transform; }
    .slide { flex: 0 0 100%; min-width: 0; height: 100%; padding: 2px; }

    .course {
      position: relative; height: 100%; display: flex; flex-direction: column; gap: clamp(6px, 1.2dvh, 12px);
      padding: clamp(12px, 2.1dvh, 20px); border-radius: 20px; overflow: hidden; isolation: isolate;
      background: linear-gradient(155deg, rgba(20, 38, 60, .85), rgba(8, 17, 30, .92));
      border: 1px solid var(--line);
      transition: border-color .3s, box-shadow .3s;
    }
    .course::before { /* resplandor de esquina */
      content: ''; position: absolute; z-index: -1; width: 70%; aspect-ratio: 1; right: -25%; top: -35%;
      background: radial-gradient(circle, rgba(0, 229, 255, .22), transparent 65%); transition: opacity .4s;
    }
    .course:hover { border-color: rgba(0, 229, 255, .5); box-shadow: 0 0 34px rgba(0, 229, 255, .16), inset 0 0 30px rgba(0, 229, 255, .05); }

    .c-top { flex: none; display: flex; align-items: center; gap: 12px; }
    .c-ico {
      flex: none; width: clamp(42px, 6.4dvh, 54px); aspect-ratio: 1; display: grid; place-items: center; border-radius: 16px;
      color: var(--cyan); background: linear-gradient(145deg, rgba(0, 229, 255, .16), rgba(59, 108, 255, .1));
      border: 1px solid rgba(0, 229, 255, .32); box-shadow: 0 0 22px rgba(0, 229, 255, .25), inset 0 0 14px rgba(0, 229, 255, .08);
    }
    .c-ico svg { width: 52%; height: 52%; filter: drop-shadow(0 0 6px rgba(0, 229, 255, .8)); }
    .c-title { min-width: 0; flex: 1; }
    .c-title h3 { font: 600 clamp(.98rem, 2.4dvh, 1.14rem)/1.18 var(--font-display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .price {
      flex: none; align-self: flex-start; font: 700 clamp(.95rem, 2.3dvh, 1.1rem)/1 var(--font-display); color: #00131a; padding: 7px 11px; border-radius: 999px;
      background: linear-gradient(135deg, var(--cyan), var(--green)); box-shadow: 0 0 18px rgba(0, 229, 255, .5);
    }
    .badge {
      position: absolute; top: 0; right: 14px; font: 700 .6rem/1 var(--font-body); letter-spacing: .14em; text-transform: uppercase;
      color: #fff; padding: 6px 9px 7px; border-radius: 0 0 10px 10px; background: linear-gradient(180deg, var(--pink), #c4175f); box-shadow: 0 6px 18px rgba(255, 61, 139, .45);
    }
    .c-desc { flex: 1 1 0; min-height: 0; overflow: hidden; font-size: clamp(.76rem, 1.95dvh, .88rem); line-height: 1.5; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
    .tags { flex: none; display: flex; flex-wrap: wrap; gap: 6px; overflow: hidden; }
    .tag { display: inline-flex; align-items: center; gap: 5px; font-size: .7rem; line-height: 1; padding: 6px 9px; border-radius: 999px; color: var(--cyan-soft); background: rgba(0, 229, 255, .07); border: 1px solid rgba(0, 229, 255, .2); }
    .tag svg { width: 11px; height: 11px; color: var(--green); }

    .buy {
      flex: none; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 9px;
      padding: clamp(11px, 1.9dvh, 14px); border-radius: 14px; text-decoration: none; cursor: pointer;
      font: 700 clamp(.9rem, 2.1dvh, 1rem)/1 var(--font-display); letter-spacing: .04em; color: #00131a;
      background: linear-gradient(110deg, var(--cyan), #5df7ff 40%, var(--green));
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .25) inset, 0 8px 26px rgba(0, 229, 255, .35);
      transition: transform .3s var(--ease), box-shadow .3s;
    }
    .buy::after { content: ''; position: absolute; top: 0; bottom: 0; left: -70%; width: 45%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent); transform: skewX(-20deg); animation: shine 3.6s ease-in-out infinite; }
    .buy svg { width: 1.15em; height: 1.15em; transition: transform .3s var(--ease); }
    .buy:hover, .buy:focus-visible { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(255, 255, 255, .35) inset, 0 12px 36px rgba(0, 229, 255, .6); outline: none; }
    .buy:hover svg { transform: translate(2px, -2px); }
    .buy:active { transform: scale(.98); }
    .buy.off { filter: grayscale(.8) brightness(.7); pointer-events: none; }

    .empty { height: 100%; display: grid; place-content: center; text-align: center; gap: 8px; padding: 20px; color: var(--muted); font-size: .9rem; border: 1px dashed var(--line); border-radius: 20px; }
    .empty svg { width: 30px; height: 30px; margin: 0 auto; color: var(--cyan); }

    .dots { flex: none; display: flex; justify-content: center; gap: 6px; min-height: 8px; }
    .dot { width: 7px; height: 7px; border-radius: 99px; border: 0; padding: 0; cursor: pointer; background: rgba(255, 255, 255, .2); transition: all .4s var(--ease); }
    .dot.on { width: 24px; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }

    /* ---------- Redes ---------- */
    .social { order: 5; flex: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .soc {
      position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-decoration: none; color: var(--ink);
      padding: clamp(7px, 1.3dvh, 11px) 4px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03);
      transition: transform .3s var(--ease), border-color .3s, box-shadow .3s, background .3s;
    }
    .soc svg { width: clamp(18px, 3dvh, 24px); height: clamp(18px, 3dvh, 24px); color: var(--c, var(--cyan)); filter: drop-shadow(0 0 7px var(--c, var(--cyan))); transition: transform .3s var(--ease); }
    .soc span { font-size: .64rem; color: var(--muted); letter-spacing: .03em; }
    .soc:hover, .soc:focus-visible { transform: translateY(-3px); border-color: var(--c, var(--cyan)); box-shadow: 0 8px 24px color-mix(in srgb, var(--c, var(--cyan)) 35%, transparent); background: color-mix(in srgb, var(--c, var(--cyan)) 8%, transparent); outline: none; }
    .soc:hover svg { transform: scale(1.18) rotate(-4deg); }
    .soc.wa { --c: #25d366; } .soc.fb { --c: #4c8dff; } .soc.ig { --c: #ff4d8d; } .soc.tk { --c: #36f1f0; }

    .trust { order: 6; flex: none; display: flex; justify-content: center; gap: 14px; font-size: .62rem; letter-spacing: .06em; color: var(--muted); }
    .trust span { display: inline-flex; align-items: center; gap: 5px; }
    .trust svg { width: 12px; height: 12px; color: var(--green); }

    /* ---------- Splash ---------- */
    .splash { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); transition: opacity .6s ease, visibility .6s; }
    .splash.hide { opacity: 0; visibility: hidden; }
    .splash img { height: 90px; filter: drop-shadow(0 0 18px rgba(0, 229, 255, .7)); animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.08); filter: drop-shadow(0 0 30px rgba(0, 229, 255, 1)); } }

    /* ---------- Pantallas bajas (móviles pequeños) ---------- */
    .tags { max-height: 60px; }
    @media (max-width: 759px) and (max-height: 820px) { .eyebrow { display: none; } .tags { max-height: 28px; } }
    @media (max-height: 720px) { .tagline { display: none; } .trust { display: none; } }
    @media (max-height: 640px) { .eyebrow { display: none; } .soc span { display: none; } .tags { display: none; } }
    @media (max-height: 560px) { .stats { display: none; } .c-desc { -webkit-line-clamp: 2; } }

    /* ---------- Escritorio / tablet / móvil horizontal ---------- */
    @media (min-width: 760px) {
      .shell {
        width: min(100%, 1040px); max-height: 700px;
        display: grid; grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); grid-template-rows: minmax(0, 1fr) auto; column-gap: clamp(20px, 3vw, 40px);
        padding: clamp(18px, 3.4dvh, 34px) clamp(20px, 3vw, 38px);
      }
      .left { display: flex; flex-direction: column; justify-content: center; gap: clamp(8px, 1.8dvh, 16px); min-height: 0; }
      .right { display: flex; flex-direction: column; min-height: 0; }
      .courses { order: 0; }
      .logo { height: clamp(60px, 15dvh, 150px); }
      #tt { height: clamp(60px, 11dvh, 120px); }
      .trust { order: 0; grid-column: 1 / -1; }
      .brand, .cta-products, .stats, .social, .trust { order: 0; }
      .c-desc { -webkit-line-clamp: 6; }
    }
    @media (min-width: 760px) and (max-height: 600px) { .eyebrow, .tagline, .trust { display: none; } .stats { display: grid; } .soc span { display: none; } }
    @media (min-width: 760px) and (max-height: 470px) { .stats { display: none; } .logo { height: 54px; } #tt { height: 56px; } .tags { display: flex; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .rv { opacity: 1; transform: none; }
    }
    /* si el navegador no soporta @property, el borde queda estático pero visible */
  </style>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true"><img src="assets/logo.png" alt=""></div>

  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <div class="grid"></div>
    <canvas id="particles"></canvas>
  </div>

  <main class="shell" id="shell">
    <div class="left">
      <header class="brand">
        <div class="logo-wrap rv" style="--i:0"><img class="logo" src="assets/logo.png" alt="Logo Gabora646" width="529" height="640"></div>
        <div id="tt" class="rv" style="--i:1"></div>
        <span class="eyebrow rv" style="--i:2"><i></i>Freedom Finance</span>
        <p class="tagline rv" style="--i:3">Aprende las estrategias probadas para alcanzar la independencia económica</p>
      </header>

        <a class="soc fb" href="https://www.facebook.com/gaborangel646" target="_blank" rel="noopener noreferrer" aria-label="Facebook"><span data-icon="facebook" style="display:contents"></span><span>Facebook</span></a>
        <a class="soc ig" href="https://www.instagram.com/gabora646/" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><span data-icon="instagram" style="display:contents"></span><span>Instagram</span></a>
        <a class="soc tk" href="https://www.tiktok.com/@gabora646" target="_blank" rel="noopener noreferrer" aria-label="TikTok"><span data-icon="tiktok" style="display:contents"></span><span>TikTok</span></a>
      </nav>

    <div class="right">
      <section class="courses rv" style="--i:6" aria-label="Cursos">
        <div class="courses-head">
          <h2><span data-icon="graduation" style="display:contents"></span>Todos los Cursos</h2>
          <div class="ctrls">
            <span class="counter" id="counter" aria-live="polite"></span>
            <button class="arrow" id="prev" type="button" aria-label="Curso anterior"><span data-icon="chevron-left" style="display:contents"></span></button>
            <button class="arrow" id="next" type="button" aria-label="Curso siguiente"><span data-icon="chevron-right" style="display:contents"></span></button>
          </div>
        </div>
        <div class="viewport" id="viewport"><div class="track" id="track"></div></div>
        <div class="dots" id="dots" role="tablist" aria-label="Elegir curso"></div>

    <div class="trust rv" style="--i:8">
      <span><span data-icon="lock" style="display:contents"></span>Pago seguro</span>
      <span><span data-icon="zap" style="display:contents"></span>Acceso inmediato</span>

  <script src="assets/shared.js"></script>
  <script src="assets/techtext.js"></script>
  <script>
  (function () {
    'use strict';

    /* =====================================================================
       CONFIGURACIÓN  ←  pega aquí el ID de tu bin de jsonbin.io
       (ver LEEME.md, paso 2). Mientras no lo pongas, se muestran los
       cursos por defecto y todo funciona igual.
       ===================================================================== */
    var CONFIG = {
      BIN_ID: 'PEGA_AQUI_EL_ID_DEL_BIN',
      AUTOPLAY_MS: 6500
    };

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var G = window.Gabora;

    /* ---------- iconos SVG ---------- */
    document.querySelectorAll('[data-icon]').forEach(function (el) {
      el.innerHTML = G.icon(el.getAttribute('data-icon'), el.getAttribute('data-cls') || '');
    });

    /* ---------- helper DOM seguro (nunca inyecta HTML de los datos) ---------- */
    function h(tag, attrs, kids) {
      var el = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === 'text') el.textContent = attrs[k];
        else if (k === 'html') el.innerHTML = attrs[k];
        else el.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c) el.appendChild(c); });
      return el;
    }

    /* ---------- estado ---------- */
    var data = null, list = [], idx = 0, timer = null, paused = false;
    var track = document.getElementById('track');
    var dots = document.getElementById('dots');
    var counter = document.getElementById('counter');
    var viewport = document.getElementById('viewport');

    /* ---------- estadísticas ---------- */
    function renderStats(stats) {
      var box = document.getElementById('stats');
      box.textContent = '';
      stats.forEach(function (s) {
        var num = h('b', { text: '0' });
        box.appendChild(h('div', { 'class': 'stat' }, [num, h('span', { text: s.etiqueta })]));
        countUp(num, s.valor, s.sufijo);
      });
    }
    function fmt(n) { try { return Math.round(n).toLocaleString('es-VE'); } catch (e) { return String(Math.round(n)); } }
    function countUp(el, target, suffix) {
      if (reduced || target === 0) { el.textContent = fmt(target) + suffix; return; }
      var t0 = null, dur = 1500;
      function step(t) {
        if (t0 === null) t0 = t;
        var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(target * e) + (p === 1 ? suffix : '');
        if (p < 1) requestAnimationFrame(step);
      }
      setTimeout(function () { requestAnimationFrame(step); }, 900);
    }

    /* ---------- cursos ---------- */
    function slideFor(c) {
      var tags = h('div', { 'class': 'tags' }, c.etiquetas.map(function (t) {
        return h('span', { 'class': 'tag' }, [h('i', { html: G.icon('check'), style: 'display:contents' }), document.createTextNode(t)]);
      }));
      var buy = h('a', { 'class': 'buy' + (c.url ? '' : ' off'), target: '_blank', rel: 'noopener noreferrer' }, [
        h('span', { text: 'Adquirir' }),
        h('i', { html: G.icon('arrow-up-right'), style: 'display:contents' })
      ]);
      if (c.url) buy.href = c.url; else buy.setAttribute('aria-disabled', 'true');
      buy.setAttribute('aria-label', 'Adquirir ' + c.titulo);

      var kids = [
        h('div', { 'class': 'c-top' }, [
          h('div', { 'class': 'c-ico', html: G.icon(c.icono) }),
          h('div', { 'class': 'c-title' }, [h('h3', { text: c.titulo })]),
          c.precio ? h('div', { 'class': 'price', text: c.precio }) : null
        ]),
        h('p', { 'class': 'c-desc', text: c.descripcion }),
        c.etiquetas.length ? tags : null,
        buy
      ];
      if (c.insignia) kids.unshift(h('span', { 'class': 'badge', text: c.insignia }));
      return h('div', { 'class': 'slide', role: 'group', 'aria-roledescription': 'curso' }, [h('article', { 'class': 'course' }, kids)]);
    }

    function renderCourses() {
      list = data.cursos.filter(function (c) { return c.activo; });
      track.textContent = '';
      dots.textContent = '';
      if (idx >= list.length) idx = 0;

      if (!list.length) {
        track.appendChild(h('div', { 'class': 'slide' }, [h('div', { 'class': 'empty' }, [
          h('i', { html: G.icon('rocket'), style: 'display:contents' }),
          h('span', { text: 'Muy pronto nuevos cursos.' })
        ])]));
        counter.textContent = '';
        document.getElementById('prev').style.visibility = document.getElementById('next').style.visibility = 'hidden';
        return;
      }
      var multi = list.length > 1;
      document.getElementById('prev').style.visibility = document.getElementById('next').style.visibility = multi ? 'visible' : 'hidden';

      list.forEach(function (c, i) {
        track.appendChild(slideFor(c));
        if (multi) {
          var d = h('button', { 'class': 'dot', type: 'button', role: 'tab', 'aria-label': 'Ir al curso ' + (i + 1) });
          d.addEventListener('click', function () { go(i, true); });
          dots.appendChild(d);
        }
      });
      go(idx, false);
    }

    function go(i, user) {
      if (!list.length) return;
      idx = (i + list.length) % list.length;
      track.style.transform = 'translateX(' + (-idx * 100) + '%)';
      Array.prototype.forEach.call(dots.children, function (d, k) {
        d.classList.toggle('on', k === idx);
        d.setAttribute('aria-selected', k === idx ? 'true' : 'false');
      });
      Array.prototype.forEach.call(track.children, function (s, k) { s.setAttribute('aria-hidden', k === idx ? 'false' : 'true'); s.querySelectorAll('a').forEach(function (a) { a.tabIndex = k === idx ? 0 : -1; }); });
      counter.innerHTML = '<b>' + String(idx + 1).padStart(2, '0') + '</b> / ' + String(list.length).padStart(2, '0');
      if (user) restart();
    }
    var next = function (u) { go(idx + 1, u); };
    var prev = function (u) { go(idx - 1, u); };
    document.getElementById('next').addEventListener('click', function () { next(true); });
    document.getElementById('prev').addEventListener('click', function () { prev(true); });

    /* autoplay: se detiene con el puntero encima, con foco, o si la pestaña no está visible */
    function restart() { clearInterval(timer); if (!reduced && list.length > 1) timer = setInterval(function () { if (!paused && !document.hidden) next(false); }, CONFIG.AUTOPLAY_MS); }
    viewport.addEventListener('mouseenter', function () { paused = true; });
    viewport.addEventListener('mouseleave', function () { paused = false; });
    viewport.addEventListener('focusin', function () { paused = true; });
    viewport.addEventListener('focusout', function () { paused = false; });

    /* swipe táctil / arrastre */
    var sx = 0, sy = 0, dragged = false, down = false;
    viewport.addEventListener('pointerdown', function (e) { down = true; dragged = false; sx = e.clientX; sy = e.clientY; paused = true; });
    viewport.addEventListener('pointermove', function (e) { if (down && Math.abs(e.clientX - sx) > 8) dragged = true; });
    function endDrag(e) {
      if (!down) return; down = false;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.2) { dx < 0 ? next(true) : prev(true); }
      if (e.pointerType !== 'mouse') paused = false;
    }
    viewport.addEventListener('pointerup', endDrag);
    viewport.addEventListener('pointercancel', function () { down = false; paused = false; });
    viewport.addEventListener('click', function (e) { if (dragged) { e.preventDefault(); e.stopPropagation(); } }, true);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') next(true);
      if (e.key === 'ArrowLeft') prev(true);
    });

    /* ---------- render completo ---------- */
    function render(d) {
      data = d;
      var p = document.getElementById('productos');
      if (d.ajustes.productosUrl) p.href = d.ajustes.productosUrl;
      renderCourses();
      restart();
    }
    var statsDone = false;
    function renderStatsOnce(d) { if (statsDone) { return; } statsDone = true; renderStats(d.ajustes.stats); }

    /* ---------- carga de datos: caché → defecto, y actualiza desde JSONBin ---------- */
    var cached = G.cache.get();
    var initial = G.normalize(cached ? cached.data : G.DEFAULT_DATA);
    render(initial); renderStatsOnce(initial);

    if (G.isConfigured(CONFIG.BIN_ID)) {
      G.readPublic(CONFIG.BIN_ID).then(function (rec) {
        if (!rec) return;
        var fresh = G.normalize(rec);
        G.cache.set(fresh);
        if (JSON.stringify(fresh) !== JSON.stringify(initial)) {
          render(fresh);
          /* las estadísticas se actualizan sin reiniciar la animación inicial */
          var nums = document.querySelectorAll('#stats .stat');
          fresh.ajustes.stats.forEach(function (s, i) { if (nums[i]) { nums[i].firstChild.textContent = fmt(s.valor) + s.sufijo; nums[i].lastChild.textContent = s.etiqueta; } });
        }
      }).catch(function () { /* sin conexión o bin privado: se queda lo que ya se ve */ });
    }

    /* ---------- título TechText ---------- */
    function startTitle() {
      TechText(document.getElementById('tt'), {
        text: 'Gabora646',
        fontFamily: "'Outfit', 'Segoe UI', system-ui, sans-serif",
        fontWeight: 700, fontSize: 96, letterSpacing: -0.04,
        color: '#f2fdff', accentColor: '#00e5ff',
        reveal: 'letter', dashLength: 4, dashGap: 2, specks: 14,
        intro: 'assemble', introDuration: 1.8, clickKick: true, guides: false, labels: true
      });
    }
    (document.fonts && document.fonts.load ? document.fonts.load("700 64px 'Outfit'", 'Gabora646').catch(function () {}) : Promise.resolve()).then(startTitle);

    /* ---------- foco que sigue al puntero ---------- */
    var shell = document.getElementById('shell');
    if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
      shell.addEventListener('pointermove', function (e) {
        var r = shell.getBoundingClientRect();
        shell.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        shell.style.setProperty('--my', (e.clientY - r.top) + 'px');
      }, { passive: true });
    }

    /* ---------- partículas (ligeras) ---------- */
    (function () {
      var cv = document.getElementById('particles'), c = cv.getContext('2d');
      var W = 0, H = 0, dpr = 1, pts = [], run = !reduced;
      function size() {
        dpr = Math.min(window.devicePixelRatio || 1, 1.5);
        W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr;
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        var n = Math.round(Math.min(70, Math.max(28, W * H / 24000)));
        pts = []; for (var i = 0; i < n; i++) pts.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .28, r: Math.random() * 1.4 + .5 });
      }
      function draw() {
        c.clearRect(0, 0, W, H);
        for (var i = 0; i < pts.length; i++) {
          var p = pts[i];
          if (run) { p.x += p.vx; p.y += p.vy; if (p.x < 0) p.x = W; if (p.x > W) p.x = 0; if (p.y < 0) p.y = H; if (p.y > H) p.y = 0; }
          c.fillStyle = 'rgba(125,243,255,.75)'; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill();
          for (var j = i + 1; j < pts.length; j++) {
            var q = pts[j], dx = p.x - q.x, dy = p.y - q.y, d = dx * dx + dy * dy;
            if (d < 9000) { c.strokeStyle = 'rgba(0,229,255,' + (0.16 * (1 - d / 9000)) + ')'; c.lineWidth = 1; c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(q.x, q.y); c.stroke(); }
          }
        }
        if (run && !document.hidden) requestAnimationFrame(draw);
      }
      size(); draw();
      var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(size, 150); });
      document.addEventListener('visibilitychange', function () { if (!document.hidden && run) requestAnimationFrame(draw); });
    })();

    /* ---------- splash ---------- */
    var hide = function () { document.getElementById('splash').classList.add('hide'); };
    if (document.readyState === 'complete') setTimeout(hide, 450); else window.addEventListener('load', function () { setTimeout(hide, 450); });
    setTimeout(hide, 2500); /* nunca se queda trabado */
  })();
  </script>
